    <title>Warehouse Management</title>

      This <div id="root"> is a placeholder. 
      React will "find" this div and inject your entire application inside it.
    -->

      This script tag tells the browser to load our main TypeScript file. 
      Vite will take 'main.tsx' and turn it into standard JavaScript that the browser understands.
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
